# Oura cache refresh — BACKUP + ALARM. The backend refreshes every user's
# Oura cache on its own 20-minute timer (main.py _start_inproc_oura_refresh);
# GitHub's scheduler dropped most runs Oct 10–12, so it is no longer the
# clock. This hourly run exists to go red (→ email) when any active user's
# cache is still >6h stale, i.e. when the in-process refresh itself is sick.
name: Oura refresh
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --fail-with-body -X POST "https://backnine-hu60.onrender.com/admin/oura/refresh" \
            -H "X-Admin-Key: ${{ secrets.BACKNINE_ADMIN_KEY }}" --max-time 300
