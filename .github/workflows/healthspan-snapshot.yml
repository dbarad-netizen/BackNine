# Health Span snapshot — BACKUP. The server's 20-minute loop writes
# yesterday + today for everyone on its own (main.py _snapshot_healthspan_all);
# this cron just re-runs it once a day at 1:00am Pacific in case the service
# was down. GitHub cron drops runs — never rely on it as the clock.
name: Health Span snapshot (backup)
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "https://backnine-hu60.onrender.com/admin/healthspan/snapshot" \
            -H "X-Admin-Key: ${{ secrets.BACKNINE_ADMIN_KEY }}" --max-time 180
