# Week close — backup for the in-process close (main.py _maybe_close_week,
# Monday 6am Pacific). Runs Monday 7:00am Pacific (14:00 UTC in PST; 15:00
# in PDT — either is after the server's own close). Idempotent: a closed
# week is left alone.
name: Week close (backup)
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "https://backnine-hu60.onrender.com/admin/coffee/record" \
            -H "X-Admin-Key: ${{ secrets.BACKNINE_ADMIN_KEY }}" --max-time 120
