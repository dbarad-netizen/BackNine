# Final-card push — Monday 7:30am Pacific (15:30 UTC in PDT; 14:30 in PST),
# after the week has closed with a full Sunday. Was 5pm Sunday, which pushed
# a card with a seventh of the week still being played (David 2026-10-31).
name: Push — final card
on:
  schedule:
    - cron: "30 15 * * 1"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "https://backnine-hu60.onrender.com/admin/push/scoreboard" \
            -H "X-Admin-Key: ${{ secrets.BACKNINE_ADMIN_KEY }}" --max-time 120
